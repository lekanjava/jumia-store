name: DAST - ZAP Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  zap-scan:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the Flask app
        run: docker build -t jumia-store:test -f Dockerfile .

      - name: Run the app in background
        run: |
          docker run -d \
            --network host \
            --name target-app \
            -e APP_PORT=5050 \
            jumia-store:test
          echo "Waiting for app on port 5050..."
          for i in {1..20}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5050 || echo "000")
            echo "Attempt $i: HTTP status = $STATUS"
            if [ "$STATUS" != "000" ]; then
              echo "App is responding on port 5050"
              break
            fi
            sleep 3
          done

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:5050'
          cmd_options: '-a -j'
          fail_action: false

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html

      - name: Stop the app
        if: always()
        run: docker stop target-app || true