name: DAST - ZAP Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  zap-scan:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the Flask app
        run: docker build -t jumia-store:test -f Dockerfile .

      - name: Run the app in background
        run: |
          docker run -d \
            --network host \
            --name target-app \
            jumia-store:test
          echo "Waiting for Flask app to be ready..."
          for i in {1..15}; do
            if curl -s http://localhost:5000 > /dev/null 2>&1; then
              echo "App is ready on port 5000"
              break
            fi
            echo "Attempt $i: not ready yet..."
            sleep 3
          done
          curl -v http://localhost:5000 || echo "WARNING: App may not be responding"

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:5000'
          cmd_options: '-a -j'
          fail_action: false

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html

      - name: Stop the app
        if: always()
        run: docker stop target-app || true